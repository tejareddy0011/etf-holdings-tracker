<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — ETF Holdings Intelligence</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-canvas: #f8fafc;
      --bg-surface: #ffffff;
      --bg-subtle: #f1f5f9;
      --border-subtle: #e2e8f0;
      --border-strong: #cbd5e1;
      --text-primary: #0f172a;
      --text-secondary: #334155;
      --text-muted: #64748b;
      --accent: #4f46e5;
      --accent-hover: #4338ca;
      --danger-text: #be123c;
      --danger-bg: #fff1f2;
      --danger-border: #fecdd3;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-canvas);
      background-image: radial-gradient(900px 360px at 50% -80px, rgba(79, 70, 229, 0.08), transparent);
      color: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      -webkit-font-smoothing: antialiased;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: 36px 32px;
      box-shadow: 0 4px 20px rgba(15, 23, 42, 0.06), 0 1px 3px rgba(15, 23, 42, 0.04);
    }

    .brand-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 28px;
    }

    .brand-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: linear-gradient(135deg, #4f46e5 0%, #2563eb 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(79, 70, 229, 0.28);
      margin-bottom: 14px;
    }

    .brand-header h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text-primary);
    }

    .brand-header p {
      margin: 6px 0 0;
      font-size: 13.5px;
      color: var(--text-muted);
    }

    .field {
      margin-bottom: 18px;
    }

    .field label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 6px;
    }

    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      font-family: inherit;
      font-size: 14px;
      font-weight: 500;
      padding: 11px 14px;
      border: 1px solid var(--border-strong);
      border-radius: 10px;
      background: var(--bg-surface);
      color: var(--text-primary);
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.14);
    }

    .toggle-pw {
      position: absolute;
      right: 10px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
    }

    .toggle-pw:hover {
      background: var(--bg-subtle);
      color: var(--text-primary);
    }

    .error-box {
      display: none;
      background: var(--danger-bg);
      color: var(--danger-text);
      border: 1px solid var(--danger-border);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 18px;
    }

    .btn-submit {
      width: 100%;
      padding: 12px 16px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      color: #ffffff;
      background: var(--accent);
      border: 1px solid var(--accent);
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(79, 70, 229, 0.25);
      transition: all 0.15s ease;
    }

    .btn-submit:hover {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
    }

    .btn-submit:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .footer-note {
      margin-top: 22px;
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="brand-header">
      <div class="brand-icon" aria-hidden="true">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/>
        </svg>
      </div>
      <h1>ETF Holdings Intelligence</h1>
      <p>Enter your credentials to access the dashboard</p>
    </div>

    <div id="loginError" class="error-box" role="alert"></div>

    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="field">
        <label for="loginUsername">Username</label>
        <div class="input-wrap">
          <input type="text" id="loginUsername" name="username" autocomplete="username" placeholder="Enter username" required autofocus />
        </div>
      </div>

      <div class="field">
        <label for="loginPassword">Password</label>
        <div class="input-wrap">
          <input type="password" id="loginPassword" name="password" autocomplete="current-password" placeholder="Enter password" required style="padding-right: 64px;" />
          <button type="button" class="toggle-pw" onclick="togglePasswordVisibility()" id="pwToggleBtn">Show</button>
        </div>
      </div>

      <button type="submit" class="btn-submit" id="loginSubmitBtn">Sign In to Dashboard</button>
    </form>

    <div class="footer-note">
      Protected Cloud Instance • Daily 7:00 PM PT Automated Scraper
    </div>
  </div>

  <script>
    function togglePasswordVisibility() {
      const pwInput = document.getElementById('loginPassword');
      const btn = document.getElementById('pwToggleBtn');
      if (pwInput.type === 'password') {
        pwInput.type = 'text';
        btn.textContent = 'Hide';
      } else {
        pwInput.type = 'password';
        btn.textContent = 'Show';
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const errBox = document.getElementById('loginError');
      const btn = document.getElementById('loginSubmitBtn');
      const username = document.getElementById('loginUsername').value.trim();
      const password = document.getElementById('loginPassword').value;

      errBox.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'Signing in...';

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (res.ok && data.ok) {
          window.location.href = '/';
          return;
        }
        errBox.textContent = data.error || 'Invalid username or password.';
        errBox.style.display = 'block';
      } catch (err) {
        errBox.textContent = 'Network error. Please try again.';
        errBox.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Sign In to Dashboard';
      }
    }
  </script>
</body>
</html>
